[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rekordbox-manager"
version = "0.1.0"
description = "Playlist acquisition, Rekordbox mirroring, and portable library snapshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rbx = "rbx.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/rbx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
